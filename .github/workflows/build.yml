name: Build Windows installer

on:
  push:
    branches: [main]
    paths: ['src/**', 'main.js', 'preload.js', 'package.json', 'build/**', 'installer/**', '.github/workflows/build.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          set -o pipefail
          npm run bundle 2>&1 | tee build.log
          npx electron-builder --win dir --x64 2>&1 | tee -a build.log || { tail -n 25 build.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Build installer (NSIS)
        shell: bash
        run: |
          set -o pipefail
          V=$(node -p "require('./package.json').version")
          MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          if [ ! -f "$MAKENSIS" ]; then choco install nsis -y --no-progress; fi
          cd installer
          "$MAKENSIS" -V2 -DVERSION=$V -DSRCDIR="..\dist\win-unpacked" -DOUTFILE="..\dist\IBRA-TANK-Setup-$V.exe" installer.nsi 2>&1 | tee nsis.log || { tail -n 25 nsis.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: IBRA-TANK-Setup
          path: dist/*.exe
      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: dist/IBRA-TANK-Setup-*.exe
          name: IBRA TANK v${{ steps.ver.outputs.v }}
          make_latest: true
          body: |
            حمّل ملف التنصيب IBRA-TANK-Setup وشغّله.
            التحديث: نصّب النسخة الجديدة فوق القديمة.
