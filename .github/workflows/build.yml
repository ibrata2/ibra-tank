name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: IBRA-TANK-Setup
          path: dist/*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/IBRA-TANK-Setup-*.exe
          name: IBRA TANK ${{ github.ref_name }}
          body: |
            حمّل ملف التنصيب IBRA-TANK-Setup وشغّله.
            التحديث: نصّب النسخة الجديدة فوق القديمة.
