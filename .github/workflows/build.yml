name: Build Windows installer

on:
  push:
    branches: [main]
    paths: ['src/**', 'main.js', 'preload.js', 'package.json', 'build/**', 'installer/**', '.github/workflows/build.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: IBRA-TANK-Setup
          path: dist/*.exe
      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: dist/IBRA-TANK-Setup-*.exe
          name: IBRA TANK v${{ steps.ver.outputs.v }}
          make_latest: true
          body: |
            حمّل ملف التنصيب IBRA-TANK-Setup وشغّله.
            التحديث: نصّب النسخة الجديدة فوق القديمة.
